[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory"
version = "0.1.0"
description = "Gestión simple de productos validada con property-based testing"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
